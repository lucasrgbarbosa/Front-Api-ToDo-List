<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lista de Tarefas</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <h1 class="principal-title">📋 Lista de Tarefas</h1>
    <p class="subtitle">Organize suas tarefas de forma simples e eficiente</p>
  </header>

  <main>
    <section class="form-section">
      <h2 class="title-task">Nova Tarefa</h2>
      <form class="task-form" id="task-form">
        <div class="input-group">
            <input type="text" name="titulo" placeholder="Título da tarefa" required />
            <input type="text" name="descricao" placeholder="Descrição da tarefa" required />
        </div>
        <select name="status">
          <option value="a fazer">A fazer</option>
          <option value="em andamento">Em andamento</option>
          <option value="concluída">Concluída</option>
        </select>
        <button type="submit">Adicionar Tarefa</button>
      </form>
    </section>

    <section  class="list-section">
      <h2 class="list-title">Suas Tarefas</h2>
      <ul class="task-list" id="task-list">
        </ul>
    </section>
  </main>

  <script src="js/app.js"></script>
  <footer class="rodape"> 
    <p>Desenvolvido por Lucas Ribeiro</p>
    <a href="https://github.com/lucasrgbarbosa" target="_blank" rel="noopener noreferrer" aria-label="Link para o GitHub">
      <i class="fab fa-github"></i>
    </a>

  </footer>
</body>
</html>
